<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><sitemesh:write property="title" /></title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/BaiTap01/assets/css/admin.css?v=11">
<sitemesh:write property="head" />
</head>
<body>

<div class="admin-wrapper app-shell">
    <aside class="sidebar modern-sidebar">
        <div class="brand brand-stack">
            <span class="brand-mark">UT</span>
            <span>UTEx Store</span>
        </div>

        <div class="admin-box compact-user">
            <img src="/BaiTap01/assets/images/avatar.jpg?v=2" class="avatar-img" alt="Avatar">
            <div class="admin-text">Quản trị cửa hàng</div>
            <strong>Administrator</strong>
        </div>

        <nav class="menu modern-menu">
            <a data-route="/home" href="/BaiTap01/home">Trang chủ</a>
            <a data-route="/profile" href="/BaiTap01/profile">Hồ sơ</a>
            <a data-route="/admin/category,/admin/categories" href="/BaiTap01/admin/categories">Danh mục</a>
            <a data-route="/admin/product,/admin/products" href="/BaiTap01/admin/products">Sản phẩm</a>
            <a href="/BaiTap01/product">Trang bán hàng</a>
        </nav>
    </aside>

    <div class="main modern-main">
        <header class="topbar modern-topbar">
            <div class="topbar-user">
                <img src="/BaiTap01/assets/images/avatar.jpg?v=2" class="topbar-avatar" alt="Avatar">
                <div class="welcome">UTEx Store</div>
            </div>
            <a class="logout-btn" href="/BaiTap01/logout">Đăng xuất</a>
        </header>

        <main class="content studio-content">
            <sitemesh:write property="body" />
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
    const path = window.location.pathname;
    document.querySelectorAll('[data-route]').forEach((link) => {
        const routes = link.dataset.route.split(',');
        if (routes.some((route) => path.includes(route))) {
            link.classList.add('active');
        }
    });

    document.querySelectorAll('.needs-validation').forEach((form) => {
        form.addEventListener('submit', (event) => {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    });
})();
</script>
</body>
</html>
